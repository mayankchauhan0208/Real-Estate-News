name: News Backfill

on:
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Only consider articles published on or after this date"
        required: true
        type: string
      backfill_to:
        description: "Only consider articles published on or before this date"
        required: true
        type: string
      max_items_per_source:
        description: "How many links to inspect from each source"
        required: false
        default: "8"
        type: string
      max_pages_per_source:
        description: "How many paginated source pages to inspect"
        required: false
        default: "1"
        type: string
      max_items_per_run:
        description: "Maximum publish count per batch"
        required: false
        default: "80"
        type: string
      resend_backfill:
        description: "Ignore dedupe for this backfill"
        required: false
        default: false
        type: boolean

concurrency:
  group: news-api-pusher
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - source_offset: 0
            source_limit: 100
          - source_offset: 100
            source_limit: 100
          - source_offset: 200
            source_limit: 100
          - source_offset: 300
            source_limit: 100
          - source_offset: 400
            source_limit: 100
          - source_offset: 500
            source_limit: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore dedupe state
        uses: actions/cache@v6
        with:
          path: .state
          key: news-state-backfill-${{ github.run_id }}-${{ matrix.source_offset }}
          restore-keys: |
            news-state-backfill-
            news-state-

      - name: Install dependencies
        run: npm install

      - name: Build and verify filters
        run: npm run build

      - name: Fetch and push news batch
        run: npm start
        env:
          APP_API_URL: ${{ secrets.APP_API_URL }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
          APP_LIST_API_URL: ${{ secrets.APP_LIST_API_URL }}
          APP_LIST_API_KEY: ${{ secrets.APP_LIST_API_KEY || secrets.APP_API_KEY }}
          BACKFILL_FROM: ${{ inputs.backfill_from }}
          BACKFILL_TO: ${{ inputs.backfill_to }}
          RESEND_BACKFILL: ${{ inputs.resend_backfill }}
          API_RECONCILE_PAGES: "25"
          API_RECONCILE_PAGE_SIZE: "100"
          SOURCE_OFFSET: ${{ matrix.source_offset }}
          SOURCE_LIMIT: ${{ matrix.source_limit }}
          SOURCE_CONCURRENCY: "12"
          BUILD_VERSION: "source-intelligence-v1"
          SOURCE_STRATEGY: "sequential-backfill-batch"
          AUTO_SOURCE_BATCH: "false"
          SOURCE_BATCH_COUNT: "1"
          ARTICLE_METADATA_CONCURRENCY: "6"
          FETCH_TIMEOUT_MS: "25000"
          ARTICLE_METADATA_TIMEOUT_MS: "12000"
          SOURCE_FETCH_TIMEOUT_MS: "90000"
          SOURCE_RETRY_ATTEMPTS: "4"
          ENABLE_NOIDA_CITY: "true"
          ALLOW_NOIDA_API: "true"
          MAX_ITEMS_PER_RUN: ${{ inputs.max_items_per_run }}
          MAX_ITEMS_PER_SOURCE: ${{ inputs.max_items_per_source }}
          MAX_PAGES_PER_SOURCE: ${{ inputs.max_pages_per_source }}
          DEFAULT_LOOKBACK_DAYS: "20"
          REJECTION_AUDIT_LIMIT: "5000"
          DETAILED_REJECTION_REASONS: "true"
          MISSED_NEWS_AUDIT: "true"

      - name: Upload run report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: news-backfill-report-${{ github.run_id }}-${{ matrix.source_offset }}
          path: |
            reports/runs/
            reports/source-audits/
          retention-days: 30
          if-no-files-found: ignore

      - name: Refresh hosted admin snapshot
        if: ${{ always() && matrix.source_offset == 500 }}
        continue-on-error: true
        run: |
          npm run admin:export
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin/static-state.json
          git diff --cached --quiet || (git commit -m "Update hosted admin snapshot [skip ci]" && git push)
