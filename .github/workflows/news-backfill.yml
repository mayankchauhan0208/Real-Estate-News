name: News 45-Day Backfill

on:
  workflow_dispatch:
    inputs:
      backfill_from:
        description: "Required inclusive start date (YYYY-MM-DD)"
        required: true
        type: string
      backfill_to:
        description: "Required inclusive end date (YYYY-MM-DD)"
        required: true
        type: string
      mode:
        description: "DRY_RUN must pass before a separate PRODUCTION request"
        required: true
        type: choice
        options:
          - DRY_RUN
          - PRODUCTION
        default: DRY_RUN
      backfill_id:
        description: "Stable ID used to resume the same backfill state"
        required: true
        type: string
      resume_from_offset:
        description: "Production resume offset; completed lower offsets are skipped without fetching"
        required: false
        default: "0"
        type: string

concurrency:
  group: news-45-day-backfill-${{ inputs.backfill_id }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - source_offset: 0
            source_limit: 100
          - source_offset: 100
            source_limit: 100
          - source_offset: 200
            source_limit: 100
          - source_offset: 300
            source_limit: 100
          - source_offset: 400
            source_limit: 100
          - source_offset: 500
            source_limit: 0

    steps:
      - name: Validate explicit date window
        run: |
          python - <<'PY'
          from datetime import date
          start = date.fromisoformat("${{ inputs.backfill_from }}")
          end = date.fromisoformat("${{ inputs.backfill_to }}")
          if end < start:
              raise SystemExit("backfill_to must be on or after backfill_from")
          days = (end - start).days + 1
          if days != 45:
              raise SystemExit(f"Task 41 requires exactly 45 calendar days; received {days}")
          PY

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Restore isolated backfill state
        uses: actions/cache@v6
        with:
          path: .state/task41-backfill/${{ inputs.backfill_id }}
          key: task41-backfill-${{ inputs.backfill_id }}-${{ matrix.source_offset }}
          restore-keys: |
            task41-backfill-${{ inputs.backfill_id }}-

      - name: Restore shared publication ledger
        uses: actions/cache@v6
        with:
          path: .state/publication-ledger.json
          key: publication-ledger-${{ github.run_id }}-${{ matrix.source_offset }}
          restore-keys: |
            publication-ledger-${{ github.run_id }}-
            publication-ledger-

      - name: Install dependencies
        run: npm ci

      - name: Build and verify filters
        run: npm run build

      - name: Record skipped completed source range
        if: ${{ inputs.mode == 'PRODUCTION' && fromJSON(inputs.resume_from_offset) > matrix.source_offset }}
        run: |
          mkdir -p reports/runs
          cat > "reports/runs/news-run-resume-skipped-${{ matrix.source_offset }}.json" <<'JSON'
          {
            "sourceStrategy": "task41-resumable-backfill",
            "allSelectedSourceCount": 553,
            "sources": [],
            "failures": [],
            "candidates": [],
            "posted": [],
            "fetchedArticleCount": 0,
            "expandedArticleCount": 0,
            "rejectedArticleCount": 0,
            "needsReviewCount": 0,
            "resumeSkipped": true,
            "resumeFromOffset": ${{ inputs.resume_from_offset }},
            "note": "Completed source range skipped during an authorized resume; no source fetch or publication was attempted."
          }
          JSON

      - name: Fetch and evaluate historical batch
        if: ${{ !(inputs.mode == 'PRODUCTION' && fromJSON(inputs.resume_from_offset) > matrix.source_offset) }}
        run: npm start
        env:
          APP_API_URL: ${{ secrets.APP_API_URL }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
          APP_LIST_API_URL: ${{ secrets.APP_LIST_API_URL }}
          APP_LIST_API_KEY: ${{ secrets.APP_LIST_API_KEY || secrets.APP_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PUBLICATION_CLAIM_PATH: .state/publication-claims.json
          PUBLICATION_LEDGER_PATH: .state/publication-ledger.json
          BACKFILL_FROM: ${{ inputs.backfill_from }}
          BACKFILL_TO: ${{ inputs.backfill_to }}
          RUN_MODE: BACKFILL
          BACKFILL_MODE: "true"
          BACKFILL_EXHAUSTIVE: "true"
          DRY_RUN: ${{ inputs.mode == 'DRY_RUN' && 'true' || 'false' }}
          RESEND_BACKFILL: "false"
          NEWS_STATE_DIR: .state/task41-backfill/${{ inputs.backfill_id }}
          API_RECONCILE_PAGES: "100"
          API_RECONCILE_PAGE_SIZE: "1000"
          SOURCE_OFFSET: ${{ matrix.source_offset }}
          SOURCE_LIMIT: ${{ matrix.source_limit }}
          BACKFILL_RESUME_FROM_OFFSET: ${{ inputs.resume_from_offset }}
          SOURCE_CONCURRENCY: "12"
          BUILD_VERSION: "task41-quality-hardened-backfill"
          SOURCE_STRATEGY: "task41-resumable-backfill"
          AUTO_SOURCE_BATCH: "false"
          USE_RESUMABLE_SOURCE_SCHEDULER: "false"
          ARTICLE_METADATA_CONCURRENCY: "6"
          FETCH_TIMEOUT_MS: "25000"
          ARTICLE_METADATA_TIMEOUT_MS: "12000"
          SOURCE_FETCH_TIMEOUT_MS: "90000"
          SOURCE_RETRY_ATTEMPTS: "4"
          ENABLE_NOIDA_CITY: "true"
          ALLOW_NOIDA_API: "true"
          DEFAULT_LOOKBACK_DAYS: "45"
          REJECTION_AUDIT_LIMIT: "50000"
          DETAILED_REJECTION_REASONS: "true"
          MISSED_NEWS_AUDIT: "true"
          # Include committed regional/native sources in historical recovery;
          # OFF is excluded and enabled articles pass the same content gates.
          ENABLE_EXPERIMENTAL_SOURCES: "true"

      - name: Upload historical batch report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task41-backfill-report-${{ inputs.backfill_id }}-${{ matrix.source_offset }}
          path: |
            reports/runs/
            reports/source-audits/
            .state/task41-backfill/${{ inputs.backfill_id }}/
            admin/document-thumbnails/
          retention-days: 90
          if-no-files-found: ignore

  aggregate:
    if: always()
    needs: backfill
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download batch artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: task41-backfill-report-${{ inputs.backfill_id }}-*
          path: .task41-artifacts
          merge-multiple: false
        continue-on-error: true

      - name: Aggregate and gate batch reports
        run: |
          node tools/task41-aggregate-backfill.mjs .task41-artifacts reports/source-audits/task41/backfill-summary.json

      - name: Persist generated document thumbnails
        continue-on-error: true
        run: |
          mkdir -p admin/document-thumbnails
          find .task41-artifacts -path '*/admin/document-thumbnails/*.jpg' -exec cp -n {} admin/document-thumbnails/ \;
          if compgen -G "admin/document-thumbnails/*.jpg" > /dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -f admin/document-thumbnails/*.jpg
            git diff --cached --quiet || (git commit -m "Persist backfill document thumbnails [skip ci]" && git push)
          fi

      - name: Upload aggregate report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: task41-backfill-summary-${{ inputs.backfill_id }}
          path: reports/source-audits/task41/backfill-summary.json
          retention-days: 90
          if-no-files-found: ignore
