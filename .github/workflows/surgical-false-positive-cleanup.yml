name: Surgical False Positive Cleanup

on:
  workflow_dispatch:
    inputs:
      execute:
        description: "Deactivate exactly the two guarded records after exact-match and classification checks"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Resolve, tombstone, and deactivate exact records
        run: node tools/surgical-false-positive-cleanup.mjs
        env:
          EXECUTE_CLEANUP: ${{ inputs.execute }}
          APP_API_URL: ${{ secrets.APP_API_URL }}
          APP_API_KEY: ${{ secrets.APP_API_KEY }}
          APP_LIST_API_URL: ${{ secrets.APP_LIST_API_URL }}
          APP_LIST_API_KEY: ${{ secrets.APP_LIST_API_KEY || secrets.APP_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          PUBLICATION_CLAIM_PATH: .state/publication-claims.json
      - if: always()
        uses: actions/upload-artifact@v6
        with:
          name: surgical-cleanup-${{ github.run_id }}
          path: reports/source-audits/surgical-cleanup/surgical-cleanup-report.json
          retention-days: 30
